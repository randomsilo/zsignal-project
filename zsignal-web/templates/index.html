<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zsignal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/terminal.css') }}">
</head>
<body>

<nav class="nav" id="nav">
  <button class="nav-btn nav-home is-active" data-screen="station">STATION</button>
  <button class="nav-btn nav-toggle" id="echo-btn" aria-pressed="false"
          title="Transmit each clean message received for you or CQ back to its sender, prefixed &quot;ECHO: &quot;">ECHO MODE</button>
  <button class="nav-btn" data-screen="send">SEND</button>
  <button class="nav-btn" data-screen="listen">LISTEN</button>
  <button class="nav-btn" data-screen="settings">SETTINGS</button>
  <span class="nav-status">
    <span id="status-tx" class="status-tx" hidden>TX</span>
    <span id="status-rx" class="status-rx">RX OFF</span>
  </span>
</nav>

<main>

  <!-- STATION: transmit card (left) + log card (right) -->
  <section class="screen station is-active" id="screen-station">
    <div class="card" id="tx-card">
      <div class="card-head">TRANSMIT</div>
      <div class="card-body tx-body">
        <label for="sc-sender">SENDER</label>
        <input class="callsign" id="sc-sender" type="text" placeholder="KJ5EZH" autocomplete="off" spellcheck="false">
        <label for="sc-receiver">RECEIVER</label>
        <input class="callsign" id="sc-receiver" type="text" placeholder="KJ5EZH OR CQ" autocomplete="off" spellcheck="false">
        <label for="sc-message">MESSAGE</label>
        <textarea id="sc-message" placeholder="MESSAGE TO TRANSMIT..." spellcheck="false"></textarea>
        <button class="btn btn-tx" id="sc-transmit-btn">TRANSMIT</button>
      </div>
    </div>

    <div class="card" id="log-card">
      <div class="card-head">
        <span>LOG</span>
        <span class="card-actions">
          <button class="btn btn-sm listen-toggle" id="sc-listen-btn">RX ON</button>
          <button class="btn btn-sm" id="sc-clear-btn">CLEAR</button>
        </span>
      </div>
      <div class="card-body log" id="sc-log"></div>
    </div>
  </section>

  <!-- SEND: raw text payload -->
  <section class="screen" id="screen-send">
    <div class="card">
      <div class="card-head">SEND // RAW PAYLOAD</div>
      <div class="card-body">
        <textarea id="send-text" rows="6" placeholder="MESSAGE TO TRANSMIT..." spellcheck="false"></textarea>
        <button class="btn btn-tx" id="send-btn">SEND</button>
      </div>
    </div>
    <div class="card grow">
      <div class="card-head">SENT LOG</div>
      <div class="card-body log mono-pre tx" id="sent-log"></div>
    </div>
  </section>

  <!-- LISTEN: raw hex dump -->
  <section class="screen" id="screen-listen">
    <div class="card grow">
      <div class="card-head">
        <span>LISTEN // HEX DUMP</span>
        <span class="card-actions"><button class="btn btn-sm listen-toggle" id="listen-btn">RX ON</button></span>
      </div>
      <div class="card-body log mono-pre" id="listen-log"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="screen-settings">
    <div class="card">
      <div class="card-head">SETTINGS</div>
      <div class="card-body settings">
        <label for="set-device">AUDIO DEVICE <small>ALSA -D, e.g. plughw:CARD=Device,DEV=0 (blank on Windows)</small></label>
        <input id="set-device" type="text" spellcheck="false">
        <label for="set-ptt-serial">PTT SERIAL PORT <small>COM3, /dev/ttyUSB0 ... blank to use a GPIO pin</small></label>
        <input id="set-ptt-serial" type="text" spellcheck="false">
        <label for="set-ptt-pin">PTT GPIO PIN <small>only if serial port is blank</small></label>
        <input id="set-ptt-pin" type="number">
        <label for="set-ptt-delay">PTT LEAD DELAY <small>seconds before audio</small></label>
        <input id="set-ptt-delay" type="number" step="0.1">
        <label for="set-ptt-tail-delay">PTT TAIL DELAY <small>seconds after audio</small></label>
        <input id="set-ptt-tail-delay" type="number" step="0.1">
        <div class="row">
          <button class="btn" id="save-settings-btn">SAVE</button>
          <span id="settings-saved" class="ok" hidden>SAVED.</span>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
